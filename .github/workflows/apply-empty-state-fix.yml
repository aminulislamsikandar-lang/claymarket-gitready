name: Apply empty marketplace state fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix and self-remove workflow
        shell: bash
        run: |
          set -e
          if grep -q "MOCK_USERS, MOCK_PRODUCTS" src/context/AppContext.tsx; then
            python - <<'PY'
from pathlib import Path
p = Path('src/context/AppContext.tsx')
s = p.read_text()
s = s.replace(
"  MOCK_USERS, MOCK_PRODUCTS,\n  MOCK_CATEGORIES, INITIAL_ORDERS ",
"  MOCK_USERS,\n  MOCK_CATEGORIES, INITIAL_ORDERS ",
1,
)
old = '''  const [shops, setShops] = useState<Shop[]>(() => {\n    try {\n      const saved = localStorage.getItem('claymarket_shops_v2');\n      if (saved) {\n        const parsed = JSON.parse(saved);\n        if (Array.isArray(parsed) && parsed.length > 0) return parsed;\n      }\n    } catch {\n      // Fall back to an empty list; real shops load via the effect below.\n    }\n    return [];\n  });\n  const [products, setProducts] = useState<Product[]>(() => {\n    try {\n      const saved = localStorage.getItem('claymarket_products');\n      if (saved) {\n        const parsed = JSON.parse(saved);\n        if (Array.isArray(parsed) && parsed.length > 0) return parsed;\n      }\n    } catch {\n      // Fall back to demo products.\n    }\n    return MOCK_PRODUCTS;\n  });'''
new = '''  // Shops and products always start empty and are populated exclusively from\n  // Firestore/the backend. Do not seed these collections from localStorage: a\n  // stale browser cache must never resurrect shops/products deleted from Firebase.\n  const [shops, setShops] = useState<Shop[]>([]);\n  const [products, setProducts] = useState<Product[]>([]);'''
if old not in s:
    raise SystemExit('shops/products block not found')
s = s.replace(old, new, 1)
s = s.replace(
"    try { return JSON.parse(localStorage.getItem('claymarket_wishlist') || '[\\\"prod_1\\\",\\\"prod_7\\\"]'); } catch { return ['prod_1', 'prod_7']; }",
"    try { return JSON.parse(localStorage.getItem('claymarket_wishlist') || '[]'); } catch { return []; }",
1,
)
s = s.replace(
"    try { return JSON.parse(localStorage.getItem('claymarket_followed_shops') || '[\\\"shop_aminul\\\"]'); } catch { return ['shop_aminul']; }",
"    try { return JSON.parse(localStorage.getItem('claymarket_followed_shops') || '[]'); } catch { return []; }",
1,
)
p.write_text(s)
PY
          fi
          rm -f .github/workflows/apply-empty-state-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AppContext.tsx .github/workflows/apply-empty-state-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: stop stale local cache from showing deleted shops"
          git push origin HEAD:main
