name: Remove seeded image URLs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove seeded image URL handling
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/context/AppContext.tsx')
          text = path.read_text(encoding='utf-8')
          old = "const isDummyImage = (value: unknown): boolean => { const url = String(value || '').trim().toLowerCase(); return url.includes('images.unsplash.com') || url.includes('images.pexels.com'); };"
          new = "const isDummyImage = (value: unknown): boolean => { const url = String(value || '').trim().toLowerCase(); return !url || !url.startsWith('https://res.cloudinary.com/'); };"
          if old not in text:
              raise SystemExit('Expected image policy line was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove this one-time workflow
        run: rm .github/workflows/remove-seeded-images.yml

      - name: Commit sanitized image policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.tsx .github/workflows/remove-seeded-images.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: only allow user-uploaded Cloudinary images'
          git push