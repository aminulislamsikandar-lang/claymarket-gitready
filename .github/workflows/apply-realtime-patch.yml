name: Apply realtime marketplace patch

on:
  push:
    branches: [tmp/apply-realtime-patch]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/market-autocomplete-seller
          fetch-depth: 0
          persist-credentials: true

      - name: Apply realtime change
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/context/AppContext.tsx')
          s = p.read_text()
          old_import = "  getDoc,\n  getDocs,\n  query,"
          new_import = "  getDoc,\n  onSnapshot,\n  query,"
          if old_import not in s:
              raise SystemExit('Expected getDocs import block not found')
          s = s.replace(old_import, new_import, 1)
          old = '''    const loadRemoteData = async () => {\n      try {\n        if (firebaseConfigured && firebaseDb) {\n          const [shopSnap, productSnap] = await Promise.all([\n            getDocs(collection(firebaseDb, 'shops')),\n            getDocs(query(collection(firebaseDb, 'products'), where('status', '==', 'published'))),\n          ]);\n          if (cancelled) return;\n          const remoteShops = shopSnap.docs.map(snapshot => mapFirestoreShop(snapshot.data(), snapshot.id));\n          const remoteProducts = productSnap.docs.map(snapshot => mapFirestoreProduct(snapshot.data(), snapshot.id));\n          setShops(remoteShops);\n          setProducts(remoteProducts);\n          return;\n        }\n\n        const result = await apiRequest<any[]>('/shops');\n'''
          new = '''    if (firebaseConfigured && firebaseDb) {\n      // Real-time listeners keep shops and products in sync automatically\n      // whenever the underlying Firestore data changes, instead of only\n      // loading once on mount.\n      const unsubscribeShops = onSnapshot(\n        collection(firebaseDb, 'shops'),\n        snapshot => {\n          if (cancelled) return;\n          setShops(snapshot.docs.map(doc => mapFirestoreShop(doc.data(), doc.id)));\n        },\n        () => {\n          // Leave shops as-is on listener error; a later snapshot can recover.\n        }\n      );\n      const unsubscribeProducts = onSnapshot(\n        query(collection(firebaseDb, 'products'), where('status', '==', 'published')),\n        snapshot => {\n          if (cancelled) return;\n          setProducts(snapshot.docs.map(doc => mapFirestoreProduct(doc.data(), doc.id)));\n        },\n        () => {\n          // Leave products as-is on listener error; a later snapshot can recover.\n        }\n      );\n      return () => { cancelled = true; unsubscribeShops(); unsubscribeProducts(); };\n    }\n\n    const loadRemoteData = async () => {\n      try {\n        const result = await apiRequest<any[]>('/shops');\n'''
          if old not in s:
              raise SystemExit('Expected marketplace loading block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Typecheck
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AppContext.tsx
          git diff --cached --check
          git commit -m "fix: use real-time listeners for shops and products"
          git push origin HEAD:fix/market-autocomplete-seller
