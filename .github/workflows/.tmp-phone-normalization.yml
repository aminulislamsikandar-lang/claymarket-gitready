name: apply phone normalization patch
on:
  push:
    branches:
      - fix/market-autocomplete-seller
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/market-autocomplete-seller
      - name: Apply supplied fix and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          auth = root / 'backend/src/controllers/authController.js'
          s = auth.read_text()
          old = "function normalizeEmail(email) { return String(email || '').trim().toLowerCase(); }\n\n"
          new = old + "// Normalizes a phone number for matching purposes: strips everything except\n// digits, then keeps only the last 10 digits so that \"+91 98765 43210\",\n// \"091-98765-43210\" and \"9876543210\" are all treated as the same number.\n// This is used only for lookups/comparisons — the original, user-entered\n// phone value is still what gets displayed and stored as `phone`.\nfunction normalizePhone(value) {\n  const digitsOnly = String(value || '').replace(/\\D/g, '');\n  return digitsOnly.slice(-10);\n}\n\n"
          assert old in s and 'function normalizePhone' not in s
          s = s.replace(old, new, 1)
          s = s.replace("      phone: String(phone || '').trim(),\n      role: safeRole,", "      phone: String(phone || '').trim(),\n      phoneNormalized: normalizePhone(phone),\n      role: safeRole,", 1)
          s = s.replace("  const user = await User.findOne({ phone: identifier });", "  const normalized = normalizePhone(identifier);\n  if (!normalized) return fail(res, 'Please enter a valid phone number.');\n  let user = await User.findOne({ phoneNormalized: normalized });\n  if (!user) {\n    // Fall back to a raw match for accounts created before phoneNormalized\n    // existed (e.g. seeded/legacy users that haven't re-saved their phone).\n    user = await User.findOne({ phone: identifier });\n  }", 1)
          auth.write_text(s)

          app = root / 'src/context/AppContext.tsx'
          s = app.read_text()
          marker = "  const createFirebaseProfile = async (firebaseUser: FirebaseUser, data: Record<string, unknown>) => {"
          helper = "  // Normalizes a phone number for login matching: strips everything except\n  // digits, then keeps only the last 10 digits, so \"+91 98765 43210\",\n  // \"091-98765-43210\" and \"9876543210\" all resolve to the same account.\n  // The original, user-entered value is still what gets saved/displayed\n  // as `phone` — this is only stored alongside it for lookups.\n  const normalizePhoneForLogin = (value?: string) => String(value || '').replace(/\\D/g, '').slice(-10);\n\n"
          assert marker in s and 'normalizePhoneForLogin' not in s
          s = s.replace(marker, helper + marker, 1)
          s = s.replace("phone: data.phone?.trim() || '', role: 'buyer'", "phone: data.phone?.trim() || '', phoneNormalized: normalizePhoneForLogin(data.phone), role: 'buyer'", 1)
          s = s.replace("phone: data.phone?.trim() || '', role: 'seller'", "phone: data.phone?.trim() || '', phoneNormalized: normalizePhoneForLogin(data.phone), role: 'seller'", 1)
          app.write_text(s)
          print('Applied intended changes to both files.')
          PY

          test "$(git hash-object src/context/AppContext.tsx)" = "fa5c2cea9d79081ea5c7f9940db1c2500af1bd3f"
          test "$(git hash-object backend/src/controllers/authController.js)" = "212b93e9ef002750a9e2c68b6a4df2108d2d8bf1"
          node --check backend/src/controllers/authController.js
          npm ci --ignore-scripts
          npx tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.tsx backend/src/controllers/authController.js
          git commit -m 'fix: normalize phone numbers for login matching'
          git rm .tmp/0002-phone-login-normalization.patch .github/workflows/.tmp-phone-normalization.yml
          git commit -m 'chore: remove temporary phone normalization patch workflow'
          git push origin HEAD:fix/market-autocomplete-seller
