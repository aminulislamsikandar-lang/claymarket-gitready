name: Verify stock field fix

on:
  push:
    branches:
      - fix/market-autocomplete-seller

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax-check backend changes
        run: |
          node --check backend/src/controllers/orderController.js
          node --check backend/src/controllers/productController.js
          node --check backend/src/seed/seed.js

      - name: Remove temporary verification workflow
        if: success()
        run: |
          rm .github/workflows/verify-stock-field-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-stock-field-fix.yml
          git commit -m "chore: remove temporary stock fix verification"
          git push
