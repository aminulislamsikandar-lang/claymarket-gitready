name: Verify and fix createProduct

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix exact Promise.all syntax error
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/context/AppContext.tsx')
          s = p.read_text()
          broken = "await Promise.all(productData.images.map((url) => uploadProductImageIfNeeded(productId, String(url)));"
          fixed = "await Promise.all(productData.images.map((url) => uploadProductImageIfNeeded(productId, String(url))));"
          if broken in s:
              p.write_text(s.replace(broken, fixed, 1))
          elif fixed in s:
              print('Exact fix already present.')
          else:
              raise SystemExit('Expected createProduct Promise.all line was not found; refusing to modify the file.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit verified fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/verify-and-fix-create-product.yml
          git add src/context/AppContext.tsx .github/workflows/verify-and-fix-create-product.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: close Promise.all in createProduct"
            git push origin HEAD:${{ github.head_ref }}
          fi
