name: Fix product delete state sync

on:
  push:
    branches:
      - fix/market-autocomplete-seller

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Commit fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tsc-product-delete-check.txt .github/workflows/fix-product-delete-state-sync.yml
          git add src/components/ShopProfileView.tsx
          git commit -m "fix: sync product deletion from shop profile"
          git push
