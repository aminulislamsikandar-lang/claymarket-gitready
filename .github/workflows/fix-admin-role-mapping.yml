name: Fix admin role mapping

on:
  push:
    branches:
      - fix/market-autocomplete-seller
    paths:
      - .github/workflows/fix-admin-role-mapping.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-autocomplete-seller
          fetch-depth: 0

      - name: Fix Firestore role mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/context/AppContext.tsx')
          s = p.read_text()
          replacements = {
              "role: data?.role === 'seller' ? 'seller' : 'buyer'": "role: data?.role === 'admin' ? 'admin' : data?.role === 'seller' ? 'seller' : 'buyer'",
              "role: data.role === 'seller' ? 'seller' : 'buyer'": "role: data.role === 'admin' ? 'admin' : data.role === 'seller' ? 'seller' : 'buyer'",
          }
          changed = 0
          for old, new in replacements.items():
              n = s.count(old)
              if n:
                  s = s.replace(old, new)
                  changed += n
          if changed != 2:
              raise SystemExit(f'Expected exactly 2 Firestore role mappings to change, found {changed}')
          p.write_text(s)
          print(f'Updated {changed} role mappings')
          PY

      - name: Type-check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-admin-role-mapping.yml
          git add src/context/AppContext.tsx
          git diff --cached --check
          git commit -m "fix: preserve admin role from Firestore"
          git push origin fix/market-autocomplete-seller
