# Detect known link-preview / search bots that do NOT execute JavaScript.
# Real browsers and Googlebot (which does render JS) are untouched — they
# always get the normal SPA. This must live in the top-level http{} context,
# so if your Render/Docker setup only lets you paste a server{} block, ask
# me and I'll fold it into a location-level regex instead.
map $http_user_agent $is_share_bot {
  default 0;
  "~*facebookexternalhit"  1;
  "~*Facebot"              1;
  "~*Twitterbot"           1;
  "~*LinkedInBot"          1;
  "~*WhatsApp"             1;
  "~*TelegramBot"          1;
  "~*Slackbot"             1;
  "~*Discordbot"           1;
  "~*Pinterest"            1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers -----------------------------------------------------
  # Content-Security-Policy is scoped to what this SPA actually loads:
  # Google Fonts, Firebase Auth/Firestore/Storage, optional Google Analytics
  # (only loaded after cookie consent, see src/components/Analytics.tsx), and
  # https images (product/shop photos come from Firebase Storage, Unsplash
  # demo content, and Google account avatars). 'unsafe-inline' is required for
  # style-src because this app uses inline `style` attributes, and for
  # script-src because the consent-gated GA snippet is injected inline; if you
  # later add a nonce/hash pipeline you can tighten both further. If VITE_API_URL
  # points at a different origin than this one, add it to connect-src below.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://*.firebaseapp.com" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # --- Bot-only dynamic rendering --------------------------------------------
  # Replace BACKEND_ORIGIN with your real backend URL (the same one you set
  # as VITE_API_URL, minus the /api suffix), e.g. https://claymarket-api.onrender.com
  location ~ ^/products/([^/]+)$ {
    if ($is_share_bot = 1) { return 302 https://BACKEND_ORIGIN/prerender/products/$1; }
    try_files $uri /index.html;
  }
  location ~ ^/shops/([^/]+)$ {
    if ($is_share_bot = 1) { return 302 https://BACKEND_ORIGIN/prerender/shops/$1; }
    try_files $uri /index.html;
  }
  location ~ ^/markets/([^/]+)$ {
    if ($is_share_bot = 1) { return 302 https://BACKEND_ORIGIN/prerender/markets/$1; }
    try_files $uri /index.html;
  }

  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://*.firebaseapp.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # Never cache the HTML entry point so a new deploy is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
