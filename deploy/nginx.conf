server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers -----------------------------------------------------
  # Content-Security-Policy is scoped to what this SPA actually loads:
  # Google Fonts, Firebase Auth/Firestore/Storage, optional Google Analytics
  # (only loaded after cookie consent, see src/components/Analytics.tsx), and
  # https images (product/shop photos come from Firebase Storage, Unsplash
  # demo content, and Google account avatars). 'unsafe-inline' is required for
  # style-src because this app uses inline `style` attributes, and for
  # script-src because the consent-gated GA snippet is injected inline; if you
  # later add a nonce/hash pipeline you can tighten both further. If VITE_API_URL
  # points at a different origin than this one, add it to connect-src below.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://*.firebaseapp.com" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://*.firebaseapp.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # Never cache the HTML entry point so a new deploy is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
